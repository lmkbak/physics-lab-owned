<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自有器材 · 候选验收</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,sans-serif;background:#100d19;color:#eee8fa}*{box-sizing:border-box}body{margin:0}main{display:grid;grid-template-columns:300px 1fr;min-height:100dvh}aside{padding:28px 22px;background:#191324;border-right:1px solid #cda8ff20}h1{font-size:24px;line-height:1.3;margin:12px 0}p{color:#b6a8c8}.label{font-size:11px;letter-spacing:.16em;color:#b595e0}label{display:block;margin:24px 0 6px}select,button,input{font:inherit;min-height:44px;touch-action:manipulation}select,button{width:100%;border:1px solid #b590e84d;border-radius:10px;background:#241b34;color:#f1e9ff;padding:8px 12px}button{cursor:pointer;margin-top:12px}button:active{transform:scale(.98)}:focus-visible{outline:3px solid #71dfd0;outline-offset:3px}input{width:100%}#stage{position:relative;min-width:0;min-height:500px;height:100dvh}canvas{display:block;width:100%;height:100%;touch-action:none}.readout{position:absolute;left:24px;bottom:24px;right:24px;background:#1a1426db;border:1px solid #c0a1df33;border-radius:12px;padding:14px 18px;font-variant-numeric:tabular-nums;pointer-events:none}#status{white-space:pre-line}#status[data-error]{color:#ffbaaa}@media(max-width:700px){main{grid-template-columns:1fr}aside{padding:20px}h1{font-size:22px}label{margin-top:12px}#stage{height:65dvh;min-height:380px}aside p{margin:6px 0}select,button{font-size:16px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<main><aside><span class="label">OWNED / DEVELOPMENT</span><h1>自有器材候选</h1><p>检查玻璃内腔、原创刻度、独立附件和解析液面。当前未接入实验台。</p><label for="asset">器材套组</label><select id="asset"><option value="chem_beakers_owned">烧杯与玻璃棒</option><option value="chem_test_tubes_owned">试管与四孔架</option><option value="chem_graduated_cylinders_owned">量筒与独立底座</option><option value="chem_reagent_bottles_owned">试剂瓶与四个瓶塞</option></select><label for="amount">液量：<output id="amount-value">50%</output></label><input id="amount" type="range" min="0" max="100" value="50"><button id="home">恢复全景</button><p>鼠标拖动旋转，滚轮缩放。触屏双指缩放；“恢复全景”可重置视角。</p><p id="status" role="status" aria-live="polite">正在加载候选…</p></aside><section id="stage" aria-label="三维器材预览"><div class="readout" id="readout">等待模型</div></section></main>
<script type="module" src="./viewer.js"></script></html>
